<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>PROPWASH — Command Visor</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --bg:     #060c18;
  --bg2:    #0b1528;
  --card:   #0f1d35;
  --card2:  #152240;
  --border: #1a2e50;
  --blue:   #3b7ef8;
  --cyan:   #06c0d8;
  --green:  #10d98a;
  --red:    #f04040;
  --amber:  #f5a623;
  --text:   #dde6f0;
  --muted:  #5a7298;
  --dim:    #334155;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); overscroll-behavior:none; }
.app { max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative; }
/* ── Top bar ── */
.topbar { background:rgba(6,12,24,.95); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:50; backdrop-filter:blur(12px); }
.brand { font-weight:900; font-size:16px; letter-spacing:2px; color:var(--blue); }
.topbar-mid { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.topbar-right { display:flex; align-items:center; gap:8px; }
.live-badge { font-size:9px; font-weight:800; color:var(--green); border:1px solid var(--green); padding:2px 5px; border-radius:3px; letter-spacing:.5px; animation:pulse-live 2s infinite; }
@keyframes pulse-live { 0%,100%{opacity:1} 50%{opacity:.5} }
.clock { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
/* ── Bottom nav ── */
.bottom-nav { position:sticky; bottom:0; background:rgba(6,12,24,.97); border-top:1px solid var(--border); display:flex; z-index:50; backdrop-filter:blur(12px); }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 12px; border:0; background:none; color:var(--muted); font-size:10px; font-weight:600; cursor:pointer; letter-spacing:.4px; text-transform:uppercase; transition:color .15s; border-top:2px solid transparent; }
.nav-btn.active { color:var(--blue); border-top-color:var(--blue); }
.nav-btn svg { width:20px; height:20px; }
/* ── Scrollable content ── */
.content { flex:1; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom); }
/* ── Cards ── */
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin:12px 14px 0; }
.card h1 { font-size:19px; font-weight:800; margin-bottom:2px; }
/* ── Job strip ── */
.job-strip { background:var(--card2); border:1px solid var(--border); margin:12px 14px 0; border-radius:14px; padding:14px; }
.job-strip h2 { font-size:15px; font-weight:700; }
.muted { color:var(--muted); font-size:12px; }
.chips { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.chip { font-size:10px; padding:3px 9px; border-radius:20px; background:var(--bg2); color:var(--muted); font-weight:700; border:1px solid var(--border); }
.chip.active { background:rgba(59,126,248,.15); color:var(--blue); border-color:var(--blue); }
.chip.done   { background:rgba(16,217,138,.12); color:var(--green); border-color:var(--green); }
.chip.fail   { background:rgba(240,64,64,.12);  color:var(--red);   border-color:var(--red); }
/* ── Safety banners ── */
.safety { border-radius:8px; padding:9px 12px; font-size:12px; font-weight:600; margin:12px 0; }
.safety.solar { background:rgba(245,166,35,.1); color:var(--amber); border:1px solid rgba(245,166,35,.3); }
.safety.std   { background:rgba(59,126,248,.08); color:#7db4f8; border:1px solid rgba(59,126,248,.2); }
/* ── Checklist ── */
.checklist { list-style:none; margin:12px 0; }
.checklist li { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.num { flex:0 0 22px; height:22px; border-radius:50%; background:var(--blue); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.step-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
.step-val { font-size:15px; font-weight:600; color:var(--text); }
/* ── Buttons ── */
.btn { display:block; width:100%; border:0; border-radius:10px; padding:15px; font-size:15px; font-weight:800; color:#fff; margin-top:10px; cursor:pointer; letter-spacing:.3px; transition:opacity .15s; }
.btn:active { opacity:.85; }
.btn.primary { background:var(--blue); }
.btn.go  { background:var(--green); color:#000; }
.btn.abort { background:rgba(240,64,64,.12); color:var(--red); border:1.5px solid rgba(240,64,64,.4); }
.note { font-size:11px; color:var(--muted); text-align:center; padding:10px 0 4px; }
/* ── Executing ── */
.overlay { background:#040c18; border:1px solid var(--border); border-radius:10px; height:140px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; margin:12px 0; }
.scan-line { position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--cyan),transparent); animation:scan 1.8s ease-in-out infinite; top:0; }
@keyframes scan { 0%{top:0} 100%{top:100%} }
.thermal-grid { position:absolute; inset:0; opacity:.15; background:repeating-linear-gradient(0deg,var(--cyan) 0 1px,transparent 1px 20px),repeating-linear-gradient(90deg,var(--cyan) 0 1px,transparent 1px 20px); }
.dwell-ring { text-align:center; padding:20px 0; }
.dwell-big { font-size:52px; font-weight:900; color:var(--cyan); line-height:1; font-variant-numeric:tabular-nums; }
/* ── Verdict ── */
.verdict-wrap { text-align:center; padding:16px 0; }
.verdict-icon { font-size:44px; line-height:1; }
.verdict-wrap.pass .verdict-icon { color:var(--green); }
.verdict-wrap.fail .verdict-icon { color:var(--amber); }
.verdict-wrap h1 { margin:6px 0 2px; font-size:18px; }
.metric { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.metric b { font-variant-numeric:tabular-nums; color:var(--text); }
/* ══════════════════════════════════════════════
   TWIN VIEWER
══════════════════════════════════════════════ */
.twin-wrap { padding:12px 14px 0; }
.twin-hdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.twin-prop { font-size:15px; font-weight:800; }
.mode-switch { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.mode-btn { border:0; background:none; padding:6px 14px; font-size:11px; font-weight:800; color:var(--muted); cursor:pointer; text-transform:uppercase; letter-spacing:.5px; }
.mode-btn.active { background:var(--blue); color:#fff; }
/* Reconstructed structure — canvas 3D */
.mode-row { display:flex; gap:6px; margin-bottom:10px; }
.mode-row .mode-btn { flex:1; border:1px solid var(--border); border-radius:8px; background:var(--bg2); padding:8px 4px; }
.model-wrap { margin-bottom:12px; }
.model3d { display:block; width:100%; border-radius:12px; border:1px solid var(--border);
  background:linear-gradient(180deg,#081226,#040a14); cursor:grab; touch-action:none; }
.model3d:active { cursor:grabbing; }
.model-hint { text-align:center; font-size:11px; color:var(--muted); margin-top:7px; }
.model-stage { position:relative; }
.zoom-ctl { position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:4px; }
.zoom-ctl button { width:32px; height:32px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); background:rgba(10,20,40,.82); color:var(--text);
  font-size:17px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; }
.zoom-ctl button:hover { background:rgba(59,126,248,.35); border-color:var(--blue); }
.zoom-ctl button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.zoom-ctl .zoom-reset { font-size:14px; }
.zoom-badge { position:absolute; left:10px; top:10px; font-size:10px; font-weight:800;
  letter-spacing:.4px; color:var(--muted); background:rgba(10,20,40,.7);
  border:1px solid var(--border); border-radius:6px; padding:3px 7px;
  font-variant-numeric:tabular-nums; }
.stretch-chip { display:flex; align-items:center; gap:8px; width:calc(100% - 28px);
  margin:0 14px 10px; padding:8px 10px; text-align:left; cursor:pointer;
  border:1px solid var(--border); border-radius:9px; background:var(--bg2);
  color:var(--muted); font-size:11px; font-weight:700; }
.stretch-chip:hover { border-color:var(--blue); }
.stretch-chip:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.stretch-chip.on { color:var(--text); border-color:var(--cyan); background:rgba(6,192,216,.08); }
.stretch-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0;
  border:1px solid var(--muted); }
.stretch-chip.on .stretch-dot { background:var(--cyan); border-color:var(--cyan); }
.stretch-note { margin-left:auto; font-weight:500; font-size:10px; color:var(--muted);
  text-align:right; }
.patch { display:flex; align-items:center; gap:8px; margin:8px 0 2px; padding:8px 10px;
  border:1px solid var(--border); border-radius:9px; background:rgba(6,192,216,.06); }
.patch-sw { width:26px; height:26px; border-radius:6px; flex-shrink:0; }
.patch-txt { font-size:11px; color:var(--muted); line-height:1.45; }
.patch-txt b { color:var(--text); font-variant-numeric:tabular-nums; }
/* Legend */
.legend { display:flex; flex-direction:column; align-items:stretch; margin:0 14px 12px; gap:4px; }
.legend-bar { height:8px; border-radius:4px; background:linear-gradient(to right,rgb(30,64,175),rgb(6,182,212),rgb(16,185,129),rgb(234,179,8),rgb(249,115,22),rgb(239,68,68)); }
.legend-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); }
.surf-legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin:0 14px 12px; }
.surf-key { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
.surf-key i { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
/* Detail panel */
.detail-panel { background:var(--card); border:1px solid var(--border); border-radius:14px; margin:0 14px 12px; padding:14px; }
.detail-name { font-size:16px; font-weight:800; margin-bottom:2px; }
.grime-bar-wrap { display:flex; align-items:center; gap:8px; margin:8px 0 4px; }
.grime-track { flex:1; height:8px; border-radius:4px; background:var(--bg2); position:relative; }
.grime-fill { height:100%; border-radius:4px; transition:width .5s; }
.grime-thresh { position:absolute; left:15%; top:-4px; bottom:-4px; width:2px; background:rgba(255,255,255,.3); border-radius:1px; }
.grime-pct { font-size:13px; font-weight:800; min-width:32px; text-align:right; }
.dm { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); font-size:12px; }
.dm span { color:var(--muted); }
.dm b { color:var(--text); font-variant-numeric:tabular-nums; }
.soil-box { margin-top:10px; border-radius:8px; padding:10px 12px; border:1px solid; }
/* Zone strip */
.zone-strip { display:flex; gap:8px; overflow-x:auto; padding:0 14px 12px; }
.zchip { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 10px; cursor:pointer; min-width:96px; flex-shrink:0; display:flex; gap:8px; align-items:center; }
.zchip.sel { border-color:var(--blue); }
.zdot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.zchip-id { font-size:11px; font-weight:800; }
.zchip-surf { font-size:10px; color:var(--muted); }
.zchip-soil { font-size:10px; }
/* ══════════════════════════════════════════════
   DATA HUB
══════════════════════════════════════════════ */
.hub-wrap { padding:12px 14px 0; }
.hub-title { font-size:18px; font-weight:900; margin-bottom:2px; }
.htabs { display:flex; gap:4px; margin:12px 0; overflow-x:auto; padding-bottom:2px; }
.htab { border:0; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:11px; font-weight:800; color:var(--muted); cursor:pointer; white-space:nowrap; text-transform:uppercase; letter-spacing:.4px; }
.htab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
/* stat cards */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.stat-num { font-size:22px; font-weight:900; line-height:1; }
.stat-lbl { font-size:10px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.5px; }
.section-ttl { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700; margin:14px 0 6px; }
/* resoil bars */
.resoil-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.resoil-track { flex:1; height:6px; background:var(--bg2); border-radius:3px; position:relative; }
.resoil-ideal { position:absolute; top:-3px; bottom:-3px; left:0; border-right:2px dashed rgba(255,255,255,.55); }
.resoil-fill { height:100%; border-radius:3px; }
.resoil-wks { font-size:12px; font-weight:800; min-width:44px; text-align:right; }
/* sparkline chart */
.sparkwrap { background:var(--bg2); border-radius:8px; padding:10px; margin-bottom:10px; overflow-x:auto; }
/* hub zone cards */
.hz-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; }
.hz-hdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.hz-name { font-size:14px; font-weight:800; }
.badge { font-size:9px; font-weight:800; padding:2px 7px; border-radius:20px; display:inline-block; }
.badge.pass   { background:rgba(16,217,138,.15); color:var(--green); }
.badge.fail   { background:rgba(240,64,64,.15);  color:var(--red); }
.badge.solar  { background:rgba(245,166,35,.15); color:var(--amber); }
.badge.human  { background:rgba(245,166,35,.15); color:var(--amber); }
.badge.requeue{ background:rgba(59,126,248,.15); color:var(--blue); }
.hrow { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); font-size:12px; }
.hrow span { color:var(--muted); }
/* table */
.htable-wrap { overflow-x:auto; }
.htable { width:100%; border-collapse:collapse; font-size:12px; }
.htable th { text-align:left; padding:6px 8px; font-size:10px; color:var(--muted); border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.5px; }
.htable td { padding:8px 8px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
/* alert rows */
.alert-row { display:flex; gap:10px; padding:12px; border-radius:10px; margin-bottom:8px; }
.alert-row.human  { background:rgba(245,166,35,.08); border:1px solid rgba(245,166,35,.2); }
.alert-row.requeue{ background:rgba(59,126,248,.06); border:1px solid rgba(59,126,248,.15); }
.alert-ico { font-size:18px; flex-shrink:0; }
.alert-detail { font-size:11px; color:var(--muted); margin-top:2px; }
/* PSM delta */
.delta-ok  { color:var(--green); font-weight:800; }
.delta-bad { color:var(--red); font-weight:800; }
</style>
</head>

const RAMP = [[0,[30,64,175]],[.25,[6,182,212]],[.5,[16,185,129]],[.65,[234,179,8]],[.82,[249,115,22]],[1,[239,68,68]]];
function tc(v, a=1) {
  const c = Math.max(0,Math.min(1,v));
  for(let i=1;i<RAMP.length;i++){
    if(c<=RAMP[i][0]){
      const t=(c-RAMP[i-1][0])/(RAMP[i][0]-RAMP[i-1][0]);
      const [r0,g0,b0]=RAMP[i-1][1],[r1,g1,b1]=RAMP[i][1];
      return `rgba(${Math.round(r0+(r1-r0)*t)},${Math.round(g0+(g1-g0)*t)},${Math.round(b0+(b1-b0)*t)},${a})`;
    }
  }
  return `rgba(239,68,68,${a})`;
}
function soilColor(w) { return w<8?"#f04040":w<12?"#f5a623":"#10d98a"; }
function useClock() {

  return t;
}

// The job is BUILT FROM THE SCAN: cleanable zones + their safety-gated plans,
// ordered solar-first (safety). Exclusions never appear here.
const SCAN_JOB = (()=>{
  const ord = s => ({solar_panel:0, clay_tile:1, concrete_tile:1, composite_shingle:1, stucco:2, window_glass:3}[s] ?? 9);
  const clean = SCAN_TWIN.zones.filter(z=>!z.excl).slice().sort((a,b)=>ord(a.surface)-ord(b.surface));
  const zones = clean.map(z=>{
    const pl = z.plan;
    return {
      id:z.id, label:z.label, surface:prettySurface(z.surface), solar:z.solar,
      nozzle:nozzleLabel(pl.nozzle),
      chemical:prettyChem(pl.chemical)+(pl.mix?` ${Math.round(pl.mix*100)}%`:""),
      pressure:`${pl.pressure} bar`,
      standoff:`${pl.standoff} m`, pattern:"N–S sweep",
      dwell:Math.max(4,Math.min(8,Math.round(pl.dwell/4))),   // scaled for the demo
      realDwell:pl.dwell,
      willFail: z.id==="RF-S",   // demo the re-queue loop on the south roof
    };
  });
  return { property:SCAN_TWIN.property, address:SCAN_TWIN.address,
           excluded:SCAN_TWIN.zones.filter(z=>z.excl).map(z=>z.id), zones };
})();

function OperatorView() {
  const zones=SCAN_JOB.zones;
  const [idx,setIdx]=useState(0);
  const [phase,setPhase]=useState("brief");
  const [statuses,setStatuses]=useState(zones.map(()=>""));
  const [pass,setPass]=useState(true);
  const retried=useRef({});
  const setSt=(i,s)=>setStatuses(p=>p.map((x,j)=>j===i?s:x));
  const z=zones[idx];
  const onConfirm=()=>{setSt(idx,"active");setPhase("exec");};
  const onAbort=()=>{setSt(idx,"");setPhase("brief");};
  const onResult=()=>{const f=z.willFail&&!retried.current[z.id];setPass(!f);setPhase("verdict");};
  const onNext=()=>{setSt(idx,"done");if(idx+1>=zones.length)setPhase("done");else{setIdx(idx+1);setPhase("brief");}};
  const onRetry=()=>{retried.current[z.id]=true;setSt(idx,"fail");setPhase("exec");};
  return (
    <div className="content">
      <div className="job-strip">
        <h2>{SCAN_JOB.property}</h2>
        <div className="muted">{SCAN_JOB.address}</div>
        <div style={{fontSize:10,color:"var(--cyan)",marginTop:3,fontWeight:700,letterSpacing:.3}}>
          ▲ JOB AUTO-GENERATED FROM DRONE SCAN · {zones.length} zones · plan safety-gated ✓ · {SCAN_JOB.excluded.length} excluded ({SCAN_JOB.excluded.join(", ")})
        </div>
        <div className="chips">
          {zones.map((z,i)=><span key={z.id} className={"chip "+(statuses[i]||"")}>{z.id}</span>)}
        </div>
      </div>
      <div style={{padding:"0 14px 24px"}}>
        {phase==="brief"   && <ZoneCard zone={z} onConfirm={onConfirm}/>}
        {phase==="exec"    && <Executing zone={z} onDone={()=>setPhase("verify")} onAbort={onAbort}/>}
        {phase==="verify"  && <Verifying onResult={onResult}/>}
        {phase==="verdict" && <Verdict zone={z} pass={pass} isLast={idx+1>=zones.length} onNext={onNext} onRetry={onRetry}/>}
        {phase==="done"    && <div className="card" style={{textAlign:"center",padding:"28px 20px"}}>
          <div style={{fontSize:44,color:"var(--green)"}}>✓</div>
          <h1 style={{marginTop:10}}>Job Complete</h1>
          <div className="muted" style={{marginTop:6}}>All {zones.length} scanned zones verified clean. ROI report generating.</div>
        </div>}
      </div>
      <p className="note" style={{paddingBottom:16}}>Zones + prescriptions from the scan pipeline · Operator stays in command (FAA Part 107)</p>
    </div>
  );
}

      <ol className="checklist">
        {[["Nozzle",zone.nozzle],["Chemical",zone.chemical],["Pressure",zone.pressure],["Standoff",zone.standoff],["Pattern",zone.pattern]].map(([l,v],i)=>(
          <li key={i}><span className="num">{i+1}</span><div><div className="step-lbl">{l}</div><div className="step-val">{v}</div></div></li>
        ))}
      </ol>
      {PHASES[zone.id] && (
        <div className="muted" style={{fontSize:11,margin:"2px 0 8px"}}>
          {PHASES[zone.id].length} passes: {PHASES[zone.id].map(p=>PHASE_META[p.ph][0]).join(" → ")}
        </div>
      )}
      <button className="btn primary" onClick={onConfirm}>Confirm ready — begin zone</button>
      <p className="note">You remain in command. Abort the moment anything looks wrong.</p>
    </div>
  );
}

function Executing({zone,onDone,onAbort}) {
  const [left,setLeft]=useState(zone.dwell);
  const seq=PHASES[zone.id]||[];
  const idx=seq.length?Math.min(seq.length-1,Math.floor((zone.dwell-left)/Math.max(1,zone.dwell/seq.length))):0;
  const cur=seq[idx];
  useEffect(()=>{if(left<=0){onDone();return;}const t=setTimeout(()=>setLeft(l=>l-1),1000);return()=>clearTimeout(t);},[left]);
  return (
    <div className="card" style={{marginLeft:0,marginRight:0,marginTop:12}}>
      <h1>Cleaning · {zone.id}</h1>
      {cur ? (
        <div style={{display:"flex",gap:6,margin:"8px 0 4px"}}>
          {seq.map((p,i)=>{const m=PHASE_META[p.ph];return (
            <div key={p.ph} style={{flex:1,textAlign:"center",padding:"6px 4px",borderRadius:7,
              background:i===idx?m[1]:"var(--card2)",color:i===idx?"#04121f":"var(--muted)",
              fontSize:10,fontWeight:800,border:"1px solid var(--border)"}}>{m[0]}</div>
          );})}
        </div>
      ) : null}
      <div className="muted">
        {cur ? `${PHASE_META[cur.ph][0]} — ${cur.p} bar · ${prettyChem(cur.c)}`
             : "Executing prescription — monitor overlay"}
      </div>
      <div className="overlay">
        <div className="thermal-grid"/>
        <div className="scan-line"/>
        <span style={{position:"relative",zIndex:1}}>live thermal + RGB overlay</span>
      </div>
      <div className="dwell-ring">
        <div className="dwell-big">{left}s</div>
        <div className="muted">dwell remaining</div>
      </div>
      <button className="btn abort" onClick={onAbort}>■  Abort / Override</button>
    </div>
  );
}

function Verifying({onResult}) {
  useEffect(()=>{const t=setTimeout(onResult,2000);return()=>clearTimeout(t);},[]);
  return (
    <div className="card" style={{marginLeft:0,marginRight:0,marginTop:12}}>
      <h1>Verifying…</h1>
      <div className="muted">Post-clean thermal re-scan in progress</div>
      <div className="overlay">
        <div className="thermal-grid"/>
        <div className="scan-line" style={{animationDuration:"1.2s"}}/>
        <span style={{position:"relative",zIndex:1,color:"var(--cyan)"}}>analysing residual grime proxy…</span>
      </div>
    </div>
  );
}

function Verdict({zone,pass,isLast,onNext,onRetry}) {
  return (
    <div className="card" style={{marginLeft:0,marginRight:0,marginTop:12}}>
      <div className={"verdict-wrap "+(pass?"pass":"fail")}>
        <div className="verdict-icon">{pass?"✓":"↻"}</div>
        <h1>{pass?"VERIFIED CLEAN":"RE-QUEUE — adjust pressure"}</h1>
        <div className="muted">{zone.id}</div>
      </div>
      {[["Residual (proxy)",pass?"0.06":"0.41"],["Threshold","0.15"],...(!pass?[["Adjustment","pressure +0.5 bar"]]:[])].map(([l,v])=>(
        <div key={l} className="metric"><span>{l}</span><b>{v}</b></div>
      ))}
      {pass
        ? <button className="btn go" onClick={onNext}>{isLast?"Finish job":"Next zone →"}</button>
        : <button className="btn primary" onClick={onRetry}>Retry with new params</button>}
    </div>
  );
}

/* ══ TWIN VIEWER ════════════════════════════════════════════════════════════ */
const EXCL_GREY="#5a6b82";

// Surface-type palette for the "Surface" render mode.
const SURF_RGB = { solar_panel:[56,120,200], window_glass:[90,170,210], stucco:[200,190,170],
                   clay_tile:[190,110,80], composite_shingle:[130,110,95], exclusion:[90,107,130] };

// ── Model3D: the reconstructed structure, rendered from the scan's own faces ──
// Painter's-algorithm canvas renderer. Not decorative — these are the triangles
// the fusion pipeline classified, coloured by whatever the current mode measures.
const RAMP_RGB = RAMP;
function rampRgb(v){
  const c=Math.max(0,Math.min(1,v));
  for(let i=1;i<RAMP_RGB.length;i++){
    if(c<=RAMP_RGB[i][0]){
      const t=(c-RAMP_RGB[i-1][0])/(RAMP_RGB[i][0]-RAMP_RGB[i-1][0]);
      const a=RAMP_RGB[i-1][1], b=RAMP_RGB[i][1];
      return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
    }
  }
  return [239,68,68];
}

// Zoom limits. 1.0 frames the whole structure; 9× resolves an individual mesh
// face, which is the resolution the grime layer is actually computed at.
const ZOOM_MIN = 1.0, ZOOM_MAX = 9.0;
const ZOOM_STEP = 1.6;

function Model3D({ mode, sel, onPick, stretch }) {
  const ref = useRef(null);
  const cam = useRef({ az:-0.72, el:0.42 });
  const view = useRef({ zoom:1, panX:0, panY:0 });
  const drag = useRef(null);
  const pinch = useRef(null);
  const [zoomLabel,setZoomLabel] = useState(1);

  // Model centroid — computed once; the camera orbits it.
  const centre = useMemo(()=>{
    let x=0,y=0,z=0,n=0;
    HOUSE.faces.forEach(f=>f.v.forEach(p=>{x+=p[0];y+=p[1];z+=p[2];n++;}));
    return [x/n,y/n,z/n];
  },[]);

  const draw = useCallback(()=>{
    const C=ref.current; if(!C) return;
    const X=C.getContext("2d"), w=C.width, h=C.height, s=Math.min(w,h)/14.2;
    const {az,el}=cam.current;
    const {zoom,panX,panY}=view.current;
    const ca=Math.cos(az), sa=Math.sin(az), ce=Math.cos(el), se=Math.sin(el);
    const camDir=[-sa*ce,-ca*ce,se];
    const k=s*zoom, cxp=w/2+panX, cyp=h*0.56+panY;

    const proj = p => {
      const x=p[0]-centre[0], y=p[1]-centre[1], z=p[2]-centre[2];
      const rx=x*ca-y*sa, ry=x*sa+y*ca;
      return { x:cxp+rx*k, y:cyp-(ry*se+z*ce)*k, d:ry*ce-z*se };
    };
    const outward = v => {
      const a=[v[1][0]-v[0][0],v[1][1]-v[0][1],v[1][2]-v[0][2]];
      const b=[v[2][0]-v[0][0],v[2][1]-v[0][1],v[2][2]-v[0][2]];
      let n=[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
      const L=Math.hypot(n[0],n[1],n[2])||1; n=[n[0]/L,n[1]/L,n[2]/L];
      const mid=[(v[0][0]+v[1][0]+v[2][0])/3,(v[0][1]+v[1][1]+v[2][1])/3,(v[0][2]+v[1][2]+v[2][2])/3];
      const away=[mid[0]-centre[0],mid[1]-centre[1],mid[2]-centre[2]];
      return (n[0]*away[0]+n[1]*away[1]+n[2]*away[2]<0) ? [-n[0],-n[1],-n[2]] : n;
    };

    const tris = HOUSE.faces.map(f=>{
      const pts=f.v.map(proj), nm=outward(f.v);
      return { f, pts, nm, d:(pts[0].d+pts[1].d+pts[2].d)/3 };
    }).filter(t=>{
      if(t.nm[0]*camDir[0]+t.nm[1]*camDir[1]+t.nm[2]*camDir[2] <= -0.02) return false;
      // Cull anything scrolled off-canvas — at high zoom that is most of the mesh.
      const xs=t.pts.map(q=>q.x), ys=t.pts.map(q=>q.y);
      return Math.max(...xs)>=0 && Math.min(...xs)<=w
          && Math.max(...ys)>=0 && Math.min(...ys)<=h;
    });

    // Contrast stretch: remap the ramp across the range actually on screen.
    // Grime varies within a zone by ~15 points on a 0-100 scale, so the absolute
    // ramp renders real structure as one flat-looking band. Stretching is an
    // ANALYSIS aid — the numbers everywhere else stay absolute.
    let lo=0, hi=1;
    if(stretch && (mode==="pre"||mode==="thermal")){
      const vals=tris.filter(t=>!t.f.excl)
                     .map(t=> mode==="thermal" ? (t.f.temp-28)/32 : t.f.g);
      if(vals.length){
        lo=Math.min(...vals); hi=Math.max(...vals);
        if(hi-lo < 0.04){ lo=0; hi=1; }        // uniform: nothing to stretch
      }
    }
    const norm = v => (hi>lo) ? Math.max(0,Math.min(1,(v-lo)/(hi-lo))) : v;

    X.clearRect(0,0,w,h);
    // Mesh edges only help when faces are big enough to read as facets; at low
    // zoom 357 hairlines just grey the model out.
    const edges = zoom >= 2.2;
    tris.slice().sort((a,b)=>b.d-a.d).forEach(t=>{
      const f=t.f;
      let c;
      if(mode==="surface")      c = SURF_RGB[f.surf] || [120,120,120];
      else if(mode==="thermal") c = rampRgb(norm((f.temp-28)/32));
      else if(f.excl)           c = [90,107,130];
      else                      c = rampRgb(mode==="post" ? CLEAN_TARGET : norm(f.g));

      const L=[0.4,-0.5,0.75];
      const sh=0.55+0.45*Math.abs(t.nm[0]*L[0]+t.nm[1]*L[1]+t.nm[2]*L[2]);
      X.beginPath();
      X.moveTo(t.pts[0].x,t.pts[0].y);
      X.lineTo(t.pts[1].x,t.pts[1].y);
      X.lineTo(t.pts[2].x,t.pts[2].y);
      X.closePath();
      X.fillStyle=`rgb(${c[0]*sh|0},${c[1]*sh|0},${c[2]*sh|0})`;
      X.fill();
      const isSel = sel===f.zone;
      if(isSel || edges){
        X.strokeStyle = isSel ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.07)";
        X.lineWidth   = isSel ? 2 : 1;
        X.stroke();
      } else {
        // Hairline in the fill colour closes seams between adjacent triangles.
        X.strokeStyle=X.fillStyle; X.lineWidth=1; X.stroke();
      }
    });

    // One label per zone, on its largest visible face, skipping collisions.
    // Zooming in enlarges the faces, so more labels clear the test — the map
    // gains detail rather than just getting bigger.
    const best={};
    tris.forEach(t=>{
      const p=t.pts;
      const mx=(p[0].x+p[1].x+p[2].x)/3, my=(p[0].y+p[1].y+p[2].y)/3;
      // Anchor on a face whose centroid is actually on screen, or the label
      // disappears the moment you zoom past the edge of its biggest facet.
      if(mx<24||mx>w-24||my<20||my>h-20) return;
      const ar=Math.abs((p[1].x-p[0].x)*(p[2].y-p[0].y)-(p[2].x-p[0].x)*(p[1].y-p[0].y))/2;
      if(!best[t.f.zone] || ar>best[t.f.zone].ar) best[t.f.zone]={t,ar,m:{x:mx,y:my}};
    });
    const placed=[];
    Object.values(best).sort((a,b)=>b.ar-a.ar).forEach(({t,m})=>{
      if(placed.some(q=>Math.abs(q.x-m.x)<112 && Math.abs(q.y-m.y)<28)) return;
      placed.push(m);
      X.font="700 15px -apple-system,sans-serif";
      X.textAlign="center";
      X.fillStyle="rgba(0,0,0,.7)";
      X.fillText(t.f.zone, m.x+1.5, m.y+1.5);
      X.fillStyle = t.f.excl ? "#ffb3b3" : "#ffffff";
      X.fillText(t.f.zone, m.x, m.y);
      if(t.f.excl){
        X.font="700 11px -apple-system,sans-serif";
        X.fillStyle="#ff8080";
        X.fillText("NO SPRAY", m.x, m.y+15);
      }
    });

    // Stash the projected triangles for hit-testing (front-to-back).
    C._tris = tris.slice().sort((a,b)=>a.d-b.d);
  },[mode,sel,centre,stretch]);

  useEffect(()=>{ draw(); },[draw]);

  const at = e => {
    const C=ref.current, r=C.getBoundingClientRect(), t=e.touches?e.touches[0]:e;
    return { x:(t.clientX-r.left)/r.width*C.width, y:(t.clientY-r.top)/r.height*C.height };
  };

  // Zoom about a fixed screen point, so whatever is under the cursor stays there.
  const zoomAbout = (factor, px, py) => {
    const v=view.current;
    const next=Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, v.zoom*factor));
    if(next===v.zoom) return;
    const C=ref.current, k=next/v.zoom;
    const ax=px==null ? C.width/2 : px, ay=py==null ? C.height*0.56 : py;
    v.panX = ax - C.width/2  - (ax - C.width/2  - v.panX)*k;
    v.panY = ay - C.height*0.56 - (ay - C.height*0.56 - v.panY)*k;
    v.zoom = next;
    if(next<=ZOOM_MIN+1e-6){ v.panX=0; v.panY=0; }
    clampPan();
    setZoomLabel(next);
    draw();
  };
  // Keep the structure reachable: never let it be dragged fully off-canvas.
  const clampPan = () => {
    const C=ref.current, v=view.current;
    const lim=x=>Math.max(-x, Math.min(x, 0));
    const mx=C.width*0.45*(v.zoom-1)+C.width*0.25;
    const my=C.height*0.45*(v.zoom-1)+C.height*0.25;
    v.panX=Math.max(-mx, Math.min(mx, v.panX));
    v.panY=Math.max(-my, Math.min(my, v.panY));
  };
  const resetView = () => {
    view.current={zoom:1,panX:0,panY:0}; setZoomLabel(1); draw();
  };

  const onWheel = e => {
    e.preventDefault();
    const p=at(e);
    zoomAbout(Math.pow(ZOOM_STEP, -e.deltaY/300), p.x, p.y);
  };

  const touchMid = t => {
    const C=ref.current, r=C.getBoundingClientRect();
    return { x:((t[0].clientX+t[1].clientX)/2-r.left)/r.width*C.width,
             y:((t[0].clientY+t[1].clientY)/2-r.top)/r.height*C.height,
             d:Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY) };
  };

  // Single pointer orbits; shift-drag (or two fingers) pans.
  const start = e => {
    if(e.touches && e.touches.length===2){ pinch.current=touchMid(e.touches); drag.current=null; return; }
    const p=at(e);
    drag.current={...p, ...cam.current, ...view.current, moved:0, pan:!!e.shiftKey};
  };
  const moveTo = e => {
    if(e.touches && e.touches.length===2 && pinch.current){
      if(e.cancelable) e.preventDefault();
      const m=touchMid(e.touches);
      zoomAbout(m.d/pinch.current.d, m.x, m.y);
      view.current.panX += m.x-pinch.current.x;
      view.current.panY += m.y-pinch.current.y;
      clampPan(); pinch.current=m; draw();
      return;
    }
    if(!drag.current) return;
    if(e.cancelable) e.preventDefault();
    const p=at(e), dx=p.x-drag.current.x, dy=p.y-drag.current.y;
    drag.current.moved += Math.abs(dx)+Math.abs(dy);
    if(drag.current.pan){
      view.current.panX = drag.current.panX+dx;
      view.current.panY = drag.current.panY+dy;
      clampPan();
    } else {
      cam.current = { az:drag.current.az+dx*0.006,
                      el:Math.max(0.12,Math.min(1.45,drag.current.el+dy*0.005)) };
    }
    draw();
  };
  const end = e => {
    pinch.current=null;
    const d=drag.current; drag.current=null;
    if(!d || d.moved>=6 || d.pan) return;
    const p = e.changedTouches ? at({touches:e.changedTouches}) : at(e);
    const C=ref.current, tris=C._tris||[];
    const side=(a,b)=>(p.x-b.x)*(a.y-b.y)-(a.x-b.x)*(p.y-b.y);
    for(const t of tris){
      const [A,B,D]=t.pts;
      const d1=side(A,B), d2=side(B,D), d3=side(D,A);
      if(!((d1<0||d2<0||d3<0) && (d1>0||d2>0||d3>0))) { onPick(t.f.zone, t.f); return; }
    }
    onPick(null, null);
  };

  useEffect(()=>{
    const mm=e=>moveTo(e), mu=e=>end(e);
    window.addEventListener("mousemove",mm);
    window.addEventListener("mouseup",mu);
    return ()=>{ window.removeEventListener("mousemove",mm); window.removeEventListener("mouseup",mu); };
  });

  return (
    <div className="model-stage">
      <canvas ref={ref} className="model3d" width={760} height={520}
        onMouseDown={start} onWheel={onWheel}
        onTouchStart={start} onTouchMove={moveTo} onTouchEnd={end}/>
      <div className="zoom-ctl">
        <button aria-label="Zoom in"  onClick={()=>zoomAbout(ZOOM_STEP)}>+</button>
        <button aria-label="Zoom out" onClick={()=>zoomAbout(1/ZOOM_STEP)}>−</button>
        <button aria-label="Reset view" className="zoom-reset" onClick={resetView}>⤢</button>
      </div>
      <div className="zoom-badge">{zoomLabel.toFixed(1)}×</div>
    </div>
  );
}

const TWIN_MODES = [
  ["pre",     "Dirt map"],
  ["post",    "After clean"],
  ["surface", "Surface"],
  ["thermal", "Thermal"],
];

function TwinViewer() {
  const [mode,setMode]=useState("pre");
  const [stretch,setStretch]=useState(false);
  const [sel,setSel]=useState(null);
  const twin=SCAN_TWIN;
  const zones=twin.zones;
  const byId=useMemo(()=>Object.fromEntries(zones.map(z=>[z.id,z])),[zones]);
  // `patch` is the individual mesh face last tapped — the resolution the grime
  // layer is actually computed at. The zone panel shows the mean; this shows the
  // spot, which is the whole reason for zooming in.
  const [patch,setPatch]=useState(null);
  const toggle=z=>{ setPatch(null); setSel(s=>s?.id===z.id?null:z); };
  const pick=(id,face)=>{
    setPatch(id?face:null);
    setSel(s=>(!id||s?.id===id)?null:byId[id]);
  };
  // Surface/thermal are render modes, not clean states — only "post" shows the
  // post-clean figure. Exclusions are never cleaned, so they always read pre.
  const dirt = mode==="post" ? "post" : "pre";
  const gv=z=>(z.excl||dirt==="pre")?z.gPre:(z.gPost??z.gPre);
  return (
    <div className="content">
      <div className="twin-wrap">
        <div className="twin-hdr">
          <div>
            <div className="twin-prop">{twin.property}</div>
            <div className="muted">{twin.address} · scanned {twin.captured}</div>
            <div style={{fontSize:10,color:"var(--cyan)",marginTop:3,fontWeight:700,letterSpacing:.3}}>
              ▲ RECONSTRUCTED FROM DRONE SCAN · {HOUSE.counts.faces} faces · {twin.cleanable} cleanable · {twin.excluded} excluded
            </div>
          </div>
        </div>

        {/* THE RECONSTRUCTED STRUCTURE — real geometry, real classification */}
        <div className="mode-row">
          {TWIN_MODES.map(([id,label])=>(
            <button key={id} className={"mode-btn"+(mode===id?" active":"")}
              onClick={()=>setMode(id)}>{label}</button>
          ))}
        </div>
        <div className="model-wrap">
          <Model3D mode={mode} sel={sel?.id??null} onPick={pick} stretch={stretch}/>
          <div className="model-hint">
            Drag to orbit · scroll or pinch to zoom · shift-drag to pan · tap a surface to inspect
          </div>
        </div>

        {(mode==="pre"||mode==="thermal")&&(
          <button className={"stretch-chip"+(stretch?" on":"")}
            aria-pressed={stretch} onClick={()=>setStretch(v=>!v)}>
            <span className="stretch-dot"/>
            Boost contrast
            <span className="stretch-note">
              {stretch ? "colours stretched to the visible range — figures stay absolute"
                       : "colours on the absolute 0–100% scale"}
            </span>
          </button>
        )}

        {/* legend — reads out whatever the current mode is measuring */}
        {mode==="surface"
          ? <div className="surf-legend">
              {Object.entries(SURF_RGB).map(([k,c])=>(
                <span key={k} className="surf-key">
                  <i style={{background:`rgb(${c[0]},${c[1]},${c[2]})`}}/>{prettySurface(k)}
                </span>
              ))}
            </div>
          : <div className="legend">
              <div className="legend-bar"/>
              <div className="legend-labels">
                {mode==="thermal"
                  ? <><span>Cool 28 °C</span><span>Hot 60 °C</span></>
                  : <><span>Clean</span><span>Dirty</span></>}
              </div>
              <div className="surf-key" style={{color:EXCL_GREY}}>
                <i style={{background:EXCL_GREY}}/>Exclusion — not sprayed
              </div>
            </div>}

        {/* Detail or hint */}
        {sel
          ? <ZoneDetail z={sel} mode={dirt} patch={patch}/>
          : <div style={{textAlign:"center",padding:"16px 0",color:"var(--muted)",fontSize:13}}>Tap a zone to inspect the scan result</div>
        }
      </div>

      {/* strip */}
      <div className="zone-strip">
        {zones.map(z=>{
          const v=gv(z);
          return (
            <div key={z.id} className={"zchip"+(sel?.id===z.id?" sel":"")} onClick={()=>toggle(z)}>
              <div className="zdot" style={{background:z.excl?EXCL_GREY:tc(v),boxShadow:`0 0 8px ${z.excl?"rgba(90,107,130,.5)":tc(v,.5)}`}}/>
              <div>
                <div className="zchip-id">{z.id}</div>
                <div className="zchip-surf">{prettySurface(z.surface)}</div>
                <div className="zchip-soil" style={{color:z.excl?EXCL_GREY:"var(--muted)"}}>
                  {z.excl?"⛔ no spray":`grime ${Math.round(z.gPre*100)}%`}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="note" style={{padding:"4px 14px 14px"}}>
        Surface types, grime proxy, temps & exclusion zones classified by the scan pipeline.
        Grime = PROXY (thermal+RGB, not spectral — CLAUDE.md §5).
      </div>
    </div>
  );
}

function ZoneDetail({z,mode,patch}) {
  const v=z.excl?z.gPre:(mode==="pre"?z.gPre:(z.gPost??z.gPre));
  const delta=z.gPre-(z.gPost??z.gPre);
  const spread=(z.gMax??0)-(z.gMin??0);
  return (
    <div className="detail-panel">
      <div className="detail-name">{z.label}</div>
      <div className="muted" style={{marginBottom:10}}>{z.id} · {prettySurface(z.surface)} · {z.pitch}° pitch · conf {Math.round(z.conf*100)}%</div>

      {z.excl ? (
        <div className="safety solar" style={{marginTop:0}}>⛔ EXCLUSION ZONE — {z.reason}</div>
      ) : (
        <>
          <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".5px",color:"var(--muted)",marginBottom:4}}>
            Grime proxy — {mode==="pre"?"pre":"post"}-clean
          </div>
          <div className="grime-bar-wrap">
            <div className="grime-track">
              <div className="grime-fill" style={{width:`${v*100}%`,background:tc(v)}}/>
              <div className="grime-thresh" title="Verification threshold 15%"/>
            </div>
            <span className="grime-pct" style={{color:tc(v)}}>{Math.round(v*100)}%</span>
          </div>
          {z.gPost!=null&&mode==="post"&&<div style={{fontSize:11,color:"var(--green)",marginBottom:8}}>↓ {Math.round(delta*100)} pts improvement after cleaning</div>}
          {mode==="pre"&&spread>0.02&&(
            <div className="muted" style={{fontSize:10,marginBottom:8}}>
              Not uniform: {Math.round(z.gMin*100)}–{Math.round(z.gMax*100)}% across {z.faceCount} faces.
              Zoom in to see where it sits.
            </div>
          )}
          {mode==="pre"&&patch&&(
            <div className="patch">
              <div className="patch-sw" style={{background:tc(patch.g)}}/>
              <div className="patch-txt">
                <b>This patch: {Math.round(patch.g*100)}% grime</b> — {
                  patch.g>z.gPre+0.01 ? `${Math.round((patch.g-z.gPre)*100)} pts above`
                  : patch.g<z.gPre-0.01 ? `${Math.round((z.gPre-patch.g)*100)} pts below`
                  : "level with"} the zone mean.<br/>
                Measured on one mesh face at {patch.temp} °C, not the zone average.
              </div>
            </div>
          )}
        </>
      )}

      {[
        ["Surface type", z.excl?"EXCLUSION (no spray)":prettySurface(z.surface)],
        ["Surface temp",`${z.temp.toFixed(1)} °C`],
        ["Moisture index",`${Math.round(z.moisture*100)}%`],
        ["Pitch",`${z.pitch}°`],
        ["Classifier confidence",`${Math.round(z.conf*100)}%`],
        ["Solar",z.solar?"☀ Yes — DI water, 2.0 bar ceiling":"No"],
      ].map(([l,vv])=>(
        <div key={l} className="dm">
          <span>{l}</span>
          <b style={l==="Solar"&&z.solar?{color:"var(--amber)"}:l==="Surface type"&&z.excl?{color:EXCL_GREY}:{}}>{vv}</b>
        </div>
      ))}

      {/* Cleaning plan (from plan_from_scan → safety-gated prescription) */}
      {!z.excl && zonePlan(z) && (()=>{const pl=zonePlan(z);return (
        <div className="soil-box" style={{borderColor:z.solar?"rgba(245,166,35,.4)":"var(--border)",background:z.solar?"rgba(245,166,35,.07)":"rgba(16,217,138,.06)",marginTop:10}}>
          <div style={{fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:6}}>
            ▶ Cleaning plan — safety-gated ✓
          </div>
          {[["Pressure",`${pl.pressure} bar`],
            ["Chemical",prettyChem(pl.chemical)+(pl.mix?` · mix ${Math.round(pl.mix*100)}%`:"")],
            ["Nozzle",nozzleLabel(pl.nozzle)],
            ["Dwell",`${pl.dwell}s`],
            ["Standoff",`${pl.standoff} m`]].map(([l,vv])=>(
            <div key={l} className="dm" style={{borderBottom:"1px solid rgba(255,255,255,.05)"}}><span>{l}</span><b>{vv}</b></div>
          ))}
        </div>
      );})()}

      {/* Treatment passes — one per active phase, from the phased flight plan */}
      {!z.excl && PHASES[z.id] && (
        <div className="soil-box" style={{borderColor:"var(--border)",background:"rgba(6,192,216,.05)",marginTop:10}}>
          <div style={{fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:6}}>
            ▶ Treatment passes — {PHASES[z.id].length} passes
          </div>
          {PHASES[z.id].map(p=>{const m=PHASE_META[p.ph];return (
            <div key={p.ph} className="dm" style={{borderBottom:"1px solid rgba(255,255,255,.05)"}}>
              <span style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:7,height:7,borderRadius:"50%",background:m[1],display:"inline-block"}}/>
                {m[0]}
              </span>
              <b style={{fontSize:11}}>{p.p} bar · {prettyChem(p.c)}</b>
            </div>
          );})}
          <div className="muted" style={{fontSize:10,marginTop:6}}>
            Pre-soak &amp; rinse are water-only by construction.
          </div>
        </div>
      )}

      <div className="soil-box" style={{borderColor:"var(--border)",background:"rgba(59,126,248,.06)",marginTop:10}}>
        <div style={{fontSize:10,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:2}}>Fusion decision</div>
        <div className="muted" style={{fontSize:11}}>{z.reason}</div>
      </div>
    </div>
  );
}

/* ══ DATA HUB ═══════════════════════════════════════════════════════════════ */
const HUB_TABS=["Overview","Fleet","Zones","Jobs","Pressure","Alerts"];
function DataHub() {
  const [tab,setTab]=useState("Overview");
  return (
    <div className="content">
      <div className="hub-wrap">
        <div className="hub-title">Data Hub</div>
        <div className="muted">{SCAN_TWIN.property} · fleet &amp; deconfliction live · history is demo data</div>
        <div className="htabs">
          {HUB_TABS.map(t=><button key={t} className={"htab"+(tab===t?" active":"")} onClick={()=>setTab(t)}>{t}</button>)}
        </div>
        {tab==="Overview"  && <HubOverview d={DEMO_HUB}/>}
        {tab==="Fleet"     && <HubFleet/>}
        {tab==="Zones"     && <HubZones d={DEMO_HUB}/>}
        {tab==="Jobs"      && <HubJobs d={DEMO_HUB}/>}
        {tab==="Pressure"  && <HubPressure d={DEMO_HUB}/>}
        {tab==="Alerts"    && <HubAlerts d={DEMO_HUB}/>}
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

function HubOverview({d}) {
  const s=d.summary;
  return (
    <div>
      <div className="stat-grid">
        <StatCard val={s.jobs}                                     lbl="Total jobs"            color="var(--blue)"/>
        <StatCard val={s.zones}                                    lbl="Zones cleaned"         color="var(--blue)"/>
        <StatCard val={`${Math.round(s.fpr*100)}%`}               lbl="Avg first-pass rate"   color="var(--green)"/>
        <StatCard val={s.dataPoints.toLocaleString()}              lbl="Data points collected" color="#a78bfa"/>
        <StatCard val={`$${s.revenueYTD.toLocaleString()}`}        lbl="Revenue YTD"           color="var(--cyan)"/>
        <StatCard val={`$${s.roiYTD.toLocaleString()}`}            lbl="Customer ROI delivered"color="var(--green)"/>
      </div>

      <div className="section-ttl">First-pass rate trend</div>
      <Spark points={d.jobs.map(j=>j.fpr*100)} labels={d.jobs.map(j=>j.date.slice(5))} color="var(--blue)" unit="%"/>

      <div className="section-ttl">Predicted re-soil schedule</div>
      {d.zones.map(z=>(
        <div key={z.id} className="resoil-row">
          <div style={{minWidth:72}}>
            <div style={{fontWeight:700,fontSize:12}}>{z.id}</div>
            <div className="muted" style={{fontSize:10}}>{z.surface}</div>
          </div>
          <div className="resoil-track">
            <div className="resoil-fill" style={{width:`${Math.min(100,(z.soilWeeks/16)*100)}%`,background:soilColor(z.soilWeeks)}}/>
          </div>
          <div className="resoil-wks" style={{color:soilColor(z.soilWeeks)}}>~{z.soilWeeks}w</div>
        </div>
      ))}
    </div>
  );
}

function HubFleet() {
  // Two numbers per fleet size: what deconfliction actually permits on THIS site,
  // and what the phase scheduler could reach if geometry allowed. Showing only the
  // second would overstate the case for a second aircraft.
  const rows = Object.keys(FLEET.schedule).map(k=>({
    n:+k, min:FLEET.schedule[k], ideal:FLEET.scheduleIdeal[k],
  }));
  const base = rows[0].min;
  const capped = rows.some(r=>r.ideal < r.min - 0.05);
  return (
    <div>
      <div className="note" style={{marginBottom:12,paddingTop:0}}>
        Extra aircraft cut job time by pipelining through chemical <b>dwell</b>. Two gates stand
        in the way: an FAA <b>107.35 waiver</b> (one pilot may not fly multiple aircraft without
        one), and the site's own geometry.
      </div>

      <div className="section-ttl">Job time by fleet size</div>
      {rows.map(r=>(
        <div key={r.n} className="resoil-row">
          <div style={{minWidth:78}}>
            <div style={{fontWeight:700,fontSize:12}}>{r.n} aircraft</div>
            <div className="muted" style={{fontSize:10}}>{(base/r.min).toFixed(2)}× speed-up</div>
          </div>
          <div className="resoil-track">
            <div className="resoil-fill" style={{width:`${(r.min/base)*100}%`,background:"var(--blue)"}}/>
            {r.ideal < r.min-0.05 &&
              <div className="resoil-ideal" style={{width:`${(r.ideal/base)*100}%`}}/>}
          </div>
          <div style={{fontWeight:800,fontSize:13,minWidth:74,textAlign:"right"}}>
            {r.min} min
            {r.ideal < r.min-0.05 &&
              <div className="muted" style={{fontSize:10,fontWeight:600}}>vs {r.ideal} ideal</div>}
          </div>
        </div>
      ))}
      {capped && (
        <div className="muted" style={{fontSize:10,margin:"2px 0 4px"}}>
          The marker shows the schedule if zones were far enough apart. This site never reaches it.
        </div>
      )}

      <div className="section-ttl">Deconfliction</div>
      <div className="hz-card" style={{borderColor:"rgba(245,166,35,.3)",background:"rgba(245,166,35,.06)"}}>
        <div style={{fontWeight:800,fontSize:13,marginBottom:4}}>
          ⚠ Max {FLEET.maxConcurrent} aircraft on this building
        </div>
        <div className="muted" style={{fontSize:11}}>
          Zones sit too close to fly more safely. Two aircraft may never work zones whose
          operating volumes come within the minimum separation — so extra drones add nothing
          here. Multi-aircraft economics favour <b>large commercial and solar sites</b>.
        </div>
      </div>

      <div className="section-ttl">Zone separation</div>
      <div className="htable-wrap">
        <table className="htable">
          <thead><tr><th>Zone A</th><th>Zone B</th><th>Gap</th><th>Concurrent</th></tr></thead>
          <tbody>
            {FLEET.separations.map((r,i)=>(
              <tr key={i}>
                <td>{r.zone_a}</td><td>{r.zone_b}</td>
                <td>{r.separation_m} m</td>
                <td style={{color:r.concurrent_ok?"var(--green)":"var(--red)",fontWeight:700}}>
                  {r.concurrent_ok?"OK":"BLOCKED"}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="note" style={{paddingTop:10}}>
        Separation is computed volume-to-volume (surface extent + standoff + spray reach),
        not centre-to-centre. Deconfliction can only delay work, never create an unsafe overlap.
      </div>
    </div>
  );
}

function HubZones({d}) {
  return (
    <div>
      {d.zones.map(z=>(
        <div key={z.id} className="hz-card">
          <div className="hz-hdr">
            <div>
              <div className="hz-name">{z.id} {z.solar&&<span className="badge solar">SOLAR</span>}</div>
              <div className="muted" style={{fontSize:11}}>{z.label}</div>
            </div>
            <span className={"badge "+(z.verdict==="PASS"?"pass":"fail")}>{z.verdict}</span>
          </div>
          <div className="section-ttl">Grime proxy history</div>
          <Spark points={(d.grimeHistory[z.id]||[]).map(v=>v*100)} labels={d.jobs.map(j=>j.date.slice(5))} color={tc(z.gPre)} unit="%"/>
          {[["Pre-clean",`${Math.round(z.gPre*100)}%`],["Post-clean",`${Math.round(z.gPost*100)}%`],["Surface temp",`${z.temp} °C`],["Soiling rate",`~${z.soilWeeks} weeks`]].map(([l,v])=>(
            <div key={l} className="hrow"><span>{l}</span><b style={l==="Post-clean"?{color:"var(--green)"}:l==="Soiling rate"?{color:soilColor(z.soilWeeks)}:{}}>{v}</b></div>
          ))}
        </div>
      ))}
    </div>
  );
}

function HubJobs({d}) {
  return (
    <div>
      <div className="htable-wrap">
        <table className="htable">
          <thead><tr><th>Date</th><th>Passed</th><th>Failed</th><th>FPR</th><th>Duration</th></tr></thead>
          <tbody>
            {d.jobs.map((j,i)=>(
              <tr key={i}>
                <td>{j.date}</td>
                <td style={{color:"var(--green)",fontWeight:700}}>{j.passed}</td>
                <td style={{color:j.failed>0?"var(--red)":"var(--muted)",fontWeight:700}}>{j.failed}</td>
                <td style={{color:j.fpr>=.8?"var(--green)":j.fpr>=.5?"var(--amber)":"var(--red)",fontWeight:800}}>{Math.round(j.fpr*100)}%</td>
                <td>{j.dur} min</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="note" style={{paddingTop:10}}>FPR = first-pass rate. Lower → more re-queues → calibration model adjusts prescriptions.</div>
    </div>
  );
}

function HubPressure({d}) {
  const byZone={};
  d.telemetry.forEach(t=>{if(!byZone[t.zone])byZone[t.zone]=[];byZone[t.zone].push(t);});
  return (
    <div>
      <div className="note" style={{marginBottom:12,paddingTop:0}}>PSM actual vs. prescribed nozzle pressure. Delta &gt;±0.2 bar flags for calibration review.</div>
      {Object.entries(byZone).map(([zone,rows])=>(
        <div key={zone} className="hz-card">
          <div className="hz-name" style={{marginBottom:8}}>{zone}</div>
          <div className="htable-wrap">
            <table className="htable">
              <thead><tr><th>Date</th><th>Prescribed</th><th>Actual</th><th>Delta</th></tr></thead>
              <tbody>
                {rows.map((r,i)=>{
                  const d=(r.act-r.pres).toFixed(2);
                  const ok=Math.abs(r.act-r.pres)<=0.2;
                  return (
                    <tr key={i}>
                      <td>{r.date}</td>
                      <td>{r.pres.toFixed(2)} bar</td>
                      <td>{r.act.toFixed(2)} bar</td>
                      <td className={ok?"delta-ok":"delta-bad"}>{d>=0?"+":""}{d}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      ))}
    </div>
  );
}

function HubAlerts({d}) {
  return (
    <div>
      {d.alerts.map((a,i)=>(
        <div key={i} className={"alert-row "+a.type}>
          <div className="alert-ico">{a.type==="human"?"⚠":"↻"}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13}}>
              {a.type==="human"?"Human presence detected":"Re-queue triggered"}
              <span className="muted" style={{fontWeight:400,marginLeft:6,fontSize:11}}>{a.zone} · {a.time}</span>
            </div>
            <div className="alert-detail">{a.msg}</div>
          </div>
          <span className={"badge "+(a.resolved?"pass":"fail")}>{a.resolved?"Resolved":"Open"}</span>
        </div>
      ))}
    </div>
  );
}

/* ══ SHARED COMPONENTS ══════════════════════════════════════════════════════ */
function StatCard({val,lbl,color}) {
  return (
    <div className="stat-card">
      <div className="stat-num" style={{color}}>{val}</div>
      <div className="stat-lbl">{lbl}</div>
    </div>
  );
}

function Spark({points,labels,color,unit=""}) {
  const W=260,H=72,p=8;
  if(points.length<2) return null;
  const n=points.length;
  const mx=Math.max(...points)||1;
  const xs=points.map((_,i)=>p+(i/(n-1))*(W-p*2));
  const ys=points.map(v=>H-p-((v/mx)*(H-p*2)));
  const path=xs.map((x,i)=>`${i===0?"M":"L"}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const area=path+` L${xs[n-1]},${H} L${xs[0]},${H} Z`;
  return (
    <div className="sparkwrap">
      <svg width={W} height={H} style={{overflow:"visible",display:"block"}}>
        <path d={area} fill={color} fillOpacity={.1}/>
        <path d={path} fill="none" stroke={color} strokeWidth={2} strokeLinejoin="round"/>
        {xs.map((x,i)=>(
          <g key={i}>
            <circle cx={x} cy={ys[i]} r={3} fill={color}/>
            <text x={x} y={H-1} textAnchor="middle" fontSize={9} fill="var(--muted)">{labels[i]}</text>
            <text x={x} y={ys[i]-6} textAnchor="middle" fontSize={9} fill={color} fontWeight="800">{points[i].toFixed(0)}{unit}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

/* ══ APP ROOT ═══════════════════════════════════════════════════════════════ */
function App() {
  const [view,setView]=useState("operator");
  const clock=useClock();
  return (
    <div className="app">
      <Topbar view={view} clock={clock}/>
      {view==="operator" && <OperatorView/>}
      {view==="twin"     && <TwinViewer/>}
      {view==="hub"      && <DataHub/>}
      <BottomNav view={view} set={setView}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
