<title>PROPWASH Command Visor</title>
<style>

:root {
  --bg:     #060c18;
  --bg2:    #0b1528;
  --card:   #0f1d35;
  --card2:  #152240;
  --border: #1a2e50;
  --blue:   #3b7ef8;
  --cyan:   #06c0d8;
  --green:  #10d98a;
  --red:    #f04040;
  --amber:  #f5a623;
  --text:   #dde6f0;
  --muted:  #5a7298;
  --dim:    #334155;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); overscroll-behavior:none; }
.app { max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative; }
/* ── Top bar ── */
.topbar { background:rgba(6,12,24,.95); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:50; backdrop-filter:blur(12px); }
.brand { font-weight:900; font-size:16px; letter-spacing:2px; color:var(--blue); }
.topbar-mid { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.topbar-right { display:flex; align-items:center; gap:8px; }
.live-badge { font-size:9px; font-weight:800; color:var(--green); border:1px solid var(--green); padding:2px 5px; border-radius:3px; letter-spacing:.5px; animation:pulse-live 2s infinite; }
@keyframes pulse-live { 0%,100%{opacity:1} 50%{opacity:.5} }
.clock { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
/* ── Bottom nav ── */
.bottom-nav { position:sticky; bottom:0; background:rgba(6,12,24,.97); border-top:1px solid var(--border); display:flex; z-index:50; backdrop-filter:blur(12px); }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 12px; border:0; background:none; color:var(--muted); font-size:10px; font-weight:600; cursor:pointer; letter-spacing:.4px; text-transform:uppercase; transition:color .15s; border-top:2px solid transparent; }
.nav-btn.active { color:var(--blue); border-top-color:var(--blue); }
.nav-btn svg { width:20px; height:20px; }
/* ── Scrollable content ── */
.content { flex:1; overflow-y:auto; padding-bottom:env(safe-area-inset-bottom); }
/* ── Cards ── */
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin:12px 14px 0; }
.card h1 { font-size:19px; font-weight:800; margin-bottom:2px; }
/* ── Job strip ── */
.job-strip { background:var(--card2); border:1px solid var(--border); margin:12px 14px 0; border-radius:14px; padding:14px; }
.job-strip h2 { font-size:15px; font-weight:700; }
.muted { color:var(--muted); font-size:12px; }
.chips { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.chip { font-size:10px; padding:3px 9px; border-radius:20px; background:var(--bg2); color:var(--muted); font-weight:700; border:1px solid var(--border); }
.chip.active { background:rgba(59,126,248,.15); color:var(--blue); border-color:var(--blue); }
.chip.done   { background:rgba(16,217,138,.12); color:var(--green); border-color:var(--green); }
.chip.fail   { background:rgba(240,64,64,.12);  color:var(--red);   border-color:var(--red); }
/* ── Safety banners ── */
.safety { border-radius:8px; padding:9px 12px; font-size:12px; font-weight:600; margin:12px 0; }
.safety.solar { background:rgba(245,166,35,.1); color:var(--amber); border:1px solid rgba(245,166,35,.3); }
.safety.std   { background:rgba(59,126,248,.08); color:#7db4f8; border:1px solid rgba(59,126,248,.2); }
/* ── Checklist ── */
.checklist { list-style:none; margin:12px 0; }
.checklist li { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.num { flex:0 0 22px; height:22px; border-radius:50%; background:var(--blue); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.step-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
.step-val { font-size:15px; font-weight:600; color:var(--text); }
/* ── Buttons ── */
.btn { display:block; width:100%; border:0; border-radius:10px; padding:15px; font-size:15px; font-weight:800; color:#fff; margin-top:10px; cursor:pointer; letter-spacing:.3px; transition:opacity .15s; }
.btn:active { opacity:.85; }
.btn.primary { background:var(--blue); }
.btn.go  { background:var(--green); color:#000; }
.btn.abort { background:rgba(240,64,64,.12); color:var(--red); border:1.5px solid rgba(240,64,64,.4); }
.note { font-size:11px; color:var(--muted); text-align:center; padding:10px 0 4px; }
/* ── Executing ── */
.overlay { background:#040c18; border:1px solid var(--border); border-radius:10px; height:140px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; margin:12px 0; }
.scan-line { position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--cyan),transparent); animation:scan 1.8s ease-in-out infinite; top:0; }
@keyframes scan { 0%{top:0} 100%{top:100%} }
.thermal-grid { position:absolute; inset:0; opacity:.15; background:repeating-linear-gradient(0deg,var(--cyan) 0 1px,transparent 1px 20px),repeating-linear-gradient(90deg,var(--cyan) 0 1px,transparent 1px 20px); }
.dwell-ring { text-align:center; padding:20px 0; }
.dwell-big { font-size:52px; font-weight:900; color:var(--cyan); line-height:1; font-variant-numeric:tabular-nums; }
/* ── Verdict ── */
.verdict-wrap { text-align:center; padding:16px 0; }
.verdict-icon { font-size:44px; line-height:1; }
.verdict-wrap.pass .verdict-icon { color:var(--green); }
.verdict-wrap.fail .verdict-icon { color:var(--amber); }
.verdict-wrap h1 { margin:6px 0 2px; font-size:18px; }
.metric { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.metric b { font-variant-numeric:tabular-nums; color:var(--text); }
/* ══════════════════════════════════════════════
   TWIN VIEWER
══════════════════════════════════════════════ */
.twin-wrap { padding:12px 14px 0; }
.twin-hdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.twin-prop { font-size:15px; font-weight:800; }
.mode-switch { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.mode-btn { border:0; background:none; padding:6px 14px; font-size:11px; font-weight:800; color:var(--muted); cursor:pointer; text-transform:uppercase; letter-spacing:.5px; }
.mode-btn.active { background:var(--blue); color:#fff; }
/* Reconstructed structure — canvas 3D */
.mode-row { display:flex; gap:6px; margin-bottom:10px; }
.mode-row .mode-btn { flex:1; border:1px solid var(--border); border-radius:8px; background:var(--bg2); padding:8px 4px; }
.model-wrap { margin-bottom:12px; }
.model3d { display:block; width:100%; border-radius:12px; border:1px solid var(--border);
  background:linear-gradient(180deg,#081226,#040a14); cursor:grab; touch-action:none; }
.model3d:active { cursor:grabbing; }
.model-hint { text-align:center; font-size:11px; color:var(--muted); margin-top:7px; }
.model-stage { position:relative; }
.zoom-ctl { position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:4px; }
.zoom-ctl button { width:32px; height:32px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); background:rgba(10,20,40,.82); color:var(--text);
  font-size:17px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; }
.zoom-ctl button:hover { background:rgba(59,126,248,.35); border-color:var(--blue); }
.zoom-ctl button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.zoom-ctl .zoom-reset { font-size:14px; }
.zoom-badge { position:absolute; left:10px; top:10px; font-size:10px; font-weight:800;
  letter-spacing:.4px; color:var(--muted); background:rgba(10,20,40,.7);
  border:1px solid var(--border); border-radius:6px; padding:3px 7px;
  font-variant-numeric:tabular-nums; }
.stretch-chip { display:flex; align-items:center; gap:8px; width:calc(100% - 28px);
  margin:0 14px 10px; padding:8px 10px; text-align:left; cursor:pointer;
  border:1px solid var(--border); border-radius:9px; background:var(--bg2);
  color:var(--muted); font-size:11px; font-weight:700; }
.stretch-chip:hover { border-color:var(--blue); }
.stretch-chip:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.stretch-chip.on { color:var(--text); border-color:var(--cyan); background:rgba(6,192,216,.08); }
.stretch-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0;
  border:1px solid var(--muted); }
.stretch-chip.on .stretch-dot { background:var(--cyan); border-color:var(--cyan); }
.stretch-note { margin-left:auto; font-weight:500; font-size:10px; color:var(--muted);
  text-align:right; }
.patch { display:flex; align-items:center; gap:8px; margin:8px 0 2px; padding:8px 10px;
  border:1px solid var(--border); border-radius:9px; background:rgba(6,192,216,.06); }
.patch-sw { width:26px; height:26px; border-radius:6px; flex-shrink:0; }
.patch-txt { font-size:11px; color:var(--muted); line-height:1.45; }
.patch-txt b { color:var(--text); font-variant-numeric:tabular-nums; }
/* Legend */
.legend { display:flex; flex-direction:column; align-items:stretch; margin:0 14px 12px; gap:4px; }
.legend-bar { height:8px; border-radius:4px; background:linear-gradient(to right,rgb(30,64,175),rgb(6,182,212),rgb(16,185,129),rgb(234,179,8),rgb(249,115,22),rgb(239,68,68)); }
.legend-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); }
.surf-legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin:0 14px 12px; }
.surf-key { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
.surf-key i { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
/* Detail panel */
.detail-panel { background:var(--card); border:1px solid var(--border); border-radius:14px; margin:0 14px 12px; padding:14px; }
.detail-name { font-size:16px; font-weight:800; margin-bottom:2px; }
.grime-bar-wrap { display:flex; align-items:center; gap:8px; margin:8px 0 4px; }
.grime-track { flex:1; height:8px; border-radius:4px; background:var(--bg2); position:relative; }
.grime-fill { height:100%; border-radius:4px; transition:width .5s; }
.grime-thresh { position:absolute; left:15%; top:-4px; bottom:-4px; width:2px; background:rgba(255,255,255,.3); border-radius:1px; }
.grime-pct { font-size:13px; font-weight:800; min-width:32px; text-align:right; }
.dm { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); font-size:12px; }
.dm span { color:var(--muted); }
.dm b { color:var(--text); font-variant-numeric:tabular-nums; }
.soil-box { margin-top:10px; border-radius:8px; padding:10px 12px; border:1px solid; }
/* Zone strip */
.zone-strip { display:flex; gap:8px; overflow-x:auto; padding:0 14px 12px; }
.zchip { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 10px; cursor:pointer; min-width:96px; flex-shrink:0; display:flex; gap:8px; align-items:center; }
.zchip.sel { border-color:var(--blue); }
.zdot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.zchip-id { font-size:11px; font-weight:800; }
.zchip-surf { font-size:10px; color:var(--muted); }
.zchip-soil { font-size:10px; }
/* ══════════════════════════════════════════════
   DATA HUB
══════════════════════════════════════════════ */
.hub-wrap { padding:12px 14px 0; }
.hub-title { font-size:18px; font-weight:900; margin-bottom:2px; }
.htabs { display:flex; gap:4px; margin:12px 0; overflow-x:auto; padding-bottom:2px; }
.htab { border:0; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:11px; font-weight:800; color:var(--muted); cursor:pointer; white-space:nowrap; text-transform:uppercase; letter-spacing:.4px; }
.htab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
/* stat cards */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.stat-num { font-size:22px; font-weight:900; line-height:1; }
.stat-lbl { font-size:10px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.5px; }
.section-ttl { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:700; margin:14px 0 6px; }
/* resoil bars */
.resoil-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.resoil-track { flex:1; height:6px; background:var(--bg2); border-radius:3px; position:relative; }
.resoil-ideal { position:absolute; top:-3px; bottom:-3px; left:0; border-right:2px dashed rgba(255,255,255,.55); }
.resoil-fill { height:100%; border-radius:3px; }
.resoil-wks { font-size:12px; font-weight:800; min-width:44px; text-align:right; }
/* sparkline chart */
.sparkwrap { background:var(--bg2); border-radius:8px; padding:10px; margin-bottom:10px; overflow-x:auto; }
/* hub zone cards */
.hz-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; }
.hz-hdr { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.hz-name { font-size:14px; font-weight:800; }
.badge { font-size:9px; font-weight:800; padding:2px 7px; border-radius:20px; display:inline-block; }
.badge.pass   { background:rgba(16,217,138,.15); color:var(--green); }
.badge.fail   { background:rgba(240,64,64,.15);  color:var(--red); }
.badge.solar  { background:rgba(245,166,35,.15); color:var(--amber); }
.badge.human  { background:rgba(245,166,35,.15); color:var(--amber); }
.badge.requeue{ background:rgba(59,126,248,.15); color:var(--blue); }
.hrow { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); font-size:12px; }
.hrow span { color:var(--muted); }
/* table */
.htable-wrap { overflow-x:auto; }
.htable { width:100%; border-collapse:collapse; font-size:12px; }
.htable th { text-align:left; padding:6px 8px; font-size:10px; color:var(--muted); border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.5px; }
.htable td { padding:8px 8px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
/* alert rows */
.alert-row { display:flex; gap:10px; padding:12px; border-radius:10px; margin-bottom:8px; }
.alert-row.human  { background:rgba(245,166,35,.08); border:1px solid rgba(245,166,35,.2); }
.alert-row.requeue{ background:rgba(59,126,248,.06); border:1px solid rgba(59,126,248,.15); }
.alert-ico { font-size:18px; flex-shrink:0; }
.alert-detail { font-size:11px; color:var(--muted); margin-top:2px; }
/* PSM delta */
.delta-ok  { color:var(--green); font-weight:800; }
.delta-bad { color:var(--red); font-weight:800; }

html,body{background:#060c18;}
</style>
